# Parameters
nc: 6  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple
anchors:
#  - [ 42,84, 52,160, 105,117 ]  # P3/8
#  - [ 276,95, 69,382, 151,190 ]  # P4/16
#  - [ 309,175, 156,370, 373,390 ]  # P5/32    东北

  - [ 42,84, 52,160, 105,117 ]  # P3/8
  - [ 276,95, 69,382, 151,190 ]  # P4/16
  - [ 309,175, 156,370, 373,390 ]  # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [ 64, 6, 2, 2 ] ],     # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1
   [-1, 1, space_to_depth,[1]],   # 2 -P2/4
   [-1, 9, C2f, [128]],          # 3
   [-1, 1, Conv, [256, 3, 1]],  # 4
   [-1, 1, space_to_depth,[1]],   # 5 -P3/8
   [-1, 18, C2f, [256]],          # 6
   [-1, 1, Conv, [512, 3, 1]],  # 7-P4/16
   [-1, 1, space_to_depth,[1]],   # 8 -P4/16
   [-1, 27, C2f, [512]],          # 9
   [-1, 1, Conv, [1024, 3, 1]], # 10-P5/32
   [-1, 1, space_to_depth,[1]],   # 11 -P5/32
   [-1, 9, C2f, [1024]],         # 12
   [-1, 1, SPPFCSPC, [1024, 5]],    # 13
#   [-1, 1, CAM, ['concat'] ],      #CAM改进
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, Conv, [512, 1, 1]],                    # 14
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],    # 15
   [[-1,9], 1, Concat, [1]],                     # 16 cat backbone P4
   [-1, 3, VoVGSCSP, [512, False]],                     # 17

   [-1, 1, Conv, [256, 1, 1]],                    # 18
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],    # 19
   [[-1, 6], 1, Concat, [1]],                     # 20 cat backbone P3
   [-1, 3, VoVGSCSP, [256, False]],               # 21 (P3/8-small)

   [-1, 1, Conv, [256, 3, 1]],                    # 22
   [-1, 1, space_to_depth,[1]],                     # 23 -P2/4
   [[-1, 18], 1, Concat, [1]],                    # 24 cat head P4
   [-1, 3, VoVGSCSP, [512, False]],                     # 25 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 1]],                    # 26
   [-1, 1, space_to_depth,[1]],                    # 27 -P2/4
   [[-1, 14], 1, Concat, [1]],                    # 28 cat head P5
   [-1, 3, VoVGSCSP, [1024, False]],                   # 29 (P5/32-large)

   [[21, 25, 29], 1, Decoupled_Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]